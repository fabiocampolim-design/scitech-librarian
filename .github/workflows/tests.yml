name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Static check (pyflakes)
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes librarian.py project.py report.py journals.py wos_manual.py tests docs
      - name: Run offline test suite (stdlib only, no network, no keys)
        run: python tests/test_librarian.py
