name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # `.` and not a hand-written list of modules: the list had silently
      # omitted i18n.py, the one module every report passes through (3.6.0).
      - name: Static check (pyflakes, every .py in the repo)
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes .
      - name: Run offline test suite (stdlib only, no network, no keys)
        run: python tests/test_librarian.py
      # the vendored-checker wiring test: its byte-identity half skips without
      # the private rules file, but the half that runs the checker works
      # anywhere -- and was never run in CI until 3.6.0
      - name: Run the vendored conformance checker's wiring test
        run: python tests/test_githubify_conformance.py
